<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{
  width:100%; height:100%;
  background:#000;
  overflow:hidden;
  font-family:'Cascadia Code','Fira Code','Consolas','Courier New',monospace;
}
.grain{
  position:fixed; inset:0; z-index:50;
  pointer-events:none; opacity:.42;
  mix-blend-mode:overlay;
}
.scanlines{
  position:fixed; inset:0; z-index:51;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.016) 0px,rgba(255,255,255,0.016) 1px,
    transparent 2px, transparent 4px
  );
}
.vignette{
  position:fixed; inset:0; z-index:52;
  pointer-events:none;
  box-shadow:inset 0 0 240px 90px rgba(0,0,0,0.82);
}
.flicker{
  position:fixed; inset:0; z-index:53;
  pointer-events:none;
  background:rgba(57,255,136,0.01);
  animation:flick 8s infinite;
}
@keyframes flick{
  0%,17%,19%,100%{ opacity:1; }
  18%{ opacity:0.5; }
}
.flash-el{
  position:fixed; inset:0; z-index:55;
  opacity:0; pointer-events:none;
}

.topbar{
  position:fixed; top:0; left:0; right:0;
  height:28px;
  background:rgba(0,0,0,0.9);
  border-bottom:1px solid rgba(57,255,136,0.12);
  display:flex; align-items:center; gap:7px; padding:0 14px;
  z-index:10; font-size:.68rem; color:rgba(57,255,136,0.38);
  letter-spacing:.3px;
}
.topbar .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.dot-r{ background:#ff5f56; }
.dot-y{ background:#ffbd2e; }
.dot-g{ background:#27c93f; }
.topbar .ttitle{ margin-inline-start:6px; }
.topbar .tsep{ margin:0 8px; opacity:.3; }
.uptime{ margin-inline-start:auto; opacity:.5; font-size:.63rem; }

.term{
  position:fixed; inset:0;
  background:#000;
  color:#39ff88;
  font-size:clamp(.63rem,1.55vw,.88rem);
  line-height:1.58;
  padding:38px clamp(16px,2.5vw,36px) 16px;
  overflow:hidden;
  display:flex; flex-direction:column-reverse;
}
.term-inner{ display:flex; flex-direction:column; }

.line{
  opacity:0;
  animation:fadein .1s forwards;
  word-break:break-all;
  white-space:pre-wrap;
}
@keyframes fadein{ to{ opacity:1; } }

/* colour classes */
.l-ok   { color:#39ff88; }
.l-cmd  { color:#b8f5d0; }
.l-root { color:#ffbd2e; }
.l-info { color:#4dd8e6; }
.l-warn { color:#e6d84d; }
.l-err  { color:#ff5c5c; }
.l-dim  { color:#2e5e40; }
.l-code { color:#7de8a8; }
.l-sep  { color:#1a3d28; }
.l-high { color:#ff9f43; }

.cursor{
  display:inline-block; width:7px; height:13px;
  background:#39ff88;
  animation:blink 1s step-end infinite;
  vertical-align:middle;
  box-shadow:0 0 7px rgba(57,255,136,0.8);
}
@keyframes blink{ 50%{ opacity:0; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <filter id="nf"><feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="3" stitchTiles="stitch"/></filter>
</svg>
<div class="grain">
  <svg width="100%" height="100%"><rect width="100%" height="100%" filter="url(#nf)" opacity="0.38"/></svg>
</div>
<div class="scanlines"></div>
<div class="vignette"></div>
<div class="flicker"></div>
<div class="flash-el" id="flashEl"></div>

<div class="topbar">
  <span class="dot dot-r"></span>
  <span class="dot dot-y"></span>
  <span class="dot dot-g"></span>
  <span class="ttitle">root@parrot:~</span>
  <span class="tsep">|</span>
  <span id="uptimeEl">uptime: 0:00:00</span>
  <span class="uptime" id="clockEl"></span>
</div>

<div class="term" id="term">
  <div class="term-inner" id="termInner"></div>
</div>

<script>
/* ---- uptime & clock ---- */
const uptimeEl = document.getElementById('uptimeEl');
const clockEl  = document.getElementById('clockEl');
let uptimeSec  = 0;
setInterval(() => {
  uptimeSec++;
  const h = String(Math.floor(uptimeSec / 3600)).padStart(2,'0');
  const m = String(Math.floor((uptimeSec % 3600) / 60)).padStart(2,'0');
  const s = String(uptimeSec % 60).padStart(2,'0');
  uptimeEl.textContent = `uptime: ${h}:${m}:${s}`;
  const now = new Date();
  clockEl.textContent = now.toTimeString().slice(0,8);
}, 1000);

/* ---- DOM refs ---- */
const termInner = document.getElementById('termInner');
const term      = document.getElementById('term');
const flashEl   = document.getElementById('flashEl');

/* ---- helpers ---- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

function appendLine(text, cls) {
  const d = document.createElement('div');
  d.className = 'line ' + (cls || 'l-ok');
  d.textContent = text;
  termInner.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

async function typeCmd(text, cls, speed = 32) {
  const d = document.createElement('div');
  d.className = 'line ' + (cls || 'l-cmd');
  termInner.appendChild(d);
  const cur = document.createElement('span');
  cur.className = 'cursor';
  d.appendChild(cur);
  for (const ch of text) {
    const s = document.createElement('span');
    s.textContent = ch;
    d.insertBefore(s, cur);
    term.scrollTop = term.scrollHeight;
    await sleep(speed + Math.random() * speed * 0.55);
  }
  cur.remove();
  await sleep(120 + Math.random() * 80);
}

function glitch() {
  if (Math.random() > 0.18) return;
  flashEl.style.background = Math.random() > 0.5 ? '#39ff88' : '#ff4444';
  flashEl.style.transition = 'none';
  flashEl.style.opacity = (0.03 + Math.random() * 0.09).toFixed(3);
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity 0.25s ease';
    flashEl.style.opacity = '0';
  });
}

const MAX_LINES = 160;
function prune() {
  const lines = termInner.querySelectorAll('.line');
  if (lines.length > MAX_LINES) {
    for (let i = 0; i < lines.length - MAX_LINES; i++) lines[i].remove();
  }
}

/* ---- play one scene ---- */
async function playScene(scene) {
  // optional header separator
  if (scene.label) {
    appendLine('', 'l-dim');
    appendLine('# ── ' + scene.label + ' ──', 'l-sep');
  }

  for (const line of scene.lines) {
    if (line.cmd) {
      await typeCmd(line.t, line.c || 'l-root', line.spd || 30);
    } else {
      const d = Math.random() * (line.jitter || 80) + (line.delay || 30);
      await sleep(d);
      appendLine(line.t, line.c || 'l-dim');
    }
    glitch();
    prune();
  }
  await sleep(600 + Math.random() * 500);
}

/* ---- shuffle helper ---- */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---- main loop: play all scenes, then shuffle & repeat ---- */
async function main() {
  appendLine('Parrot OS 6.1 — security edition', 'l-dim');
  appendLine('root@parrot:~# █', 'l-ok');
  await sleep(800);

  const order = shuffle([...Array(scenes.length).keys()]);
  let idx = 0;

  while (true) {
    const scene = scenes[order[idx % order.length]];
    await playScene(scene);
    idx++;
    if (idx % scenes.length === 0) shuffle(order);
    await sleep(300 + Math.random() * 400);
  }
}

main();
